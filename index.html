<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站登录</title>
    <!-- 引入Tailwind CSS CDN，无需本地安装，方便部署 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome图标（可选，用于密码显示/隐藏） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* 自定义少量样式，增强体验 */
        .input-focus {
            @apply focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none;
        }
        .btn-hover {
            @apply hover:bg-blue-700 transition-all duration-300;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- 登录卡片 -->
    <div class="bg-white rounded-lg shadow-md w-full max-w-md overflow-hidden">
        <!-- 登录头部 -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">用户登录</h1>
            <p class="text-blue-100 mt-1">欢迎回来，请登录您的账号</p>
        </div>

        <!-- 登录表单 -->
        <div class="p-6">
            <form id="loginForm" class="space-y-4">
                <!-- 用户名/邮箱输入框 -->
                <div>
                    <label for="username" class="block text-gray-700 font-medium mb-1">用户名/邮箱</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                        placeholder="请输入用户名或邮箱"
                        required
                    >
                </div>

                <!-- 密码输入框（带显示/隐藏） -->
                <div>
                    <label for="password" class="block text-gray-700 font-medium mb-1">密码</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus pr-10"
                            placeholder="请输入密码"
                            required
                            minlength="6"
                        >
                        <!-- 密码显示/隐藏图标 -->
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <!-- 记住我 & 忘记密码 -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 text-blue-600">
                        <span class="text-gray-600">记住我</span>
                    </label>
                    <a href="#" class="text-blue-600 hover:text-blue-800">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button 
                    type="submit" 
                    class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-lg btn-hover"
                >
                    登录
                </button>

                <!-- 注册链接 -->
                <div class="text-center text-sm text-gray-600">
                    还没有账号？<a href="#" class="text-blue-600 hover:text-blue-800 font-medium">立即注册</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 表单验证 & 交互 -->
    <script>
        // 密码显示/隐藏切换
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // 切换图标
            togglePassword.innerHTML = type === 'password' 
                ? '<i class="fa-solid fa-eye-slash"></i>' 
                : '<i class="fa-solid fa-eye"></i>';
        });

        // 表单提交验证
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // 阻止默认提交行为
            
            // 获取输入值
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // 基础验证（前端层面）
            if (!username) {
                alert('请输入用户名或邮箱');
                return;
            }
            if (password.length < 6) {
                alert('密码长度不能少于6位');
                return;
            }

            // 这里可以替换为实际的登录请求（比如调用后端API）
            console.log('登录信息：', { username, password });
            alert('登录成功！（仅前端演示，实际需对接后端）');
            
            // 示例：登录成功后跳转到首页
            // window.location.href = '/index.html';
        });
    </script>
</body>
</html>
